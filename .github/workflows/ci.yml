name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-deprecation
  PAYLOAD_SECRET: ci-secret
  POSTGRES_URL: postgres://postgres:postgres@localhost:5432/health_ci
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, types & generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Generated files are up to date
        run: |
          pnpm generate:types
          pnpm generate:importmap
          git diff --exit-code -- src/payload-types.ts 'src/app/(payload)' \
            || (echo "::error::Run 'pnpm generate:types' / 'pnpm generate:importmap' and commit the result" && exit 1)

  integration:
    name: Migrations & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: health_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to a fresh database
        run: pnpm payload:migrate

      - name: Integration tests
        run: pnpm test:int
